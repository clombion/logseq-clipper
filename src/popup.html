<!DOCTYPE html>
<html id="popup">
	<head>
		<title data-i18n="extensionName">Logseq Web Clipper</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body id="popup-container">
		<div id="popup-header">
			<div id="template-container">
				<select id="template-select">
					<option value=""></option>
				</select>
			</div>
			<div class="popup-actions">
				<button type="button" id="show-variables" class="clickable-icon"
					data-i18n-title="showPageVariables" aria-label="Show page variables">
					<i data-lucide="ellipsis" aria-hidden="true"></i>
				</button>
				<button type="button" id="reader-mode" class="clickable-icon"
					data-i18n-title="reader" aria-label="Reader mode">
					<i data-lucide="book-open" aria-hidden="true"></i>
				</button>
				<button type="button" id="highlighter-mode" class="clickable-icon"
					data-i18n-title="highlightPage" aria-label="Highlight page">
					<i data-lucide="highlighter" aria-hidden="true"></i>
				</button>
				<button type="button" id="embedded-mode" class="clickable-icon"
					data-i18n-title="openEmbedded" aria-label="Open embedded">
					<i data-lucide="picture-in-picture-2" aria-hidden="true"></i>
				</button>
				<button type="button" id="open-settings" class="clickable-icon"
					data-i18n-title="settings" aria-label="Settings">
					<i data-lucide="settings" aria-hidden="true"></i>
				</button>
			</div>
		</div>
		<p class="error-message" style="display: none;" aria-live="assertive"></p>
		<div class="clipper">
			<label for="note-name-field" class="sr-only">Note name</label>
			<textarea id="note-name-field" type="text" data-i18n="noteName" rows="1"></textarea>
			<div class="metadata-properties-header" role="button" tabindex="0" aria-expanded="true">
				<span data-i18n="properties"></span>
				<i data-lucide="chevron-down"></i>
			</div>
			<div class="metadata-properties"></div>
			<div id="note-content-container">
				<label for="note-content-field" class="sr-only">Note content</label>
				<textarea id="note-content-field" rows="4" data-i18n="notesAboutPage"></textarea>
			</div>
			<div class="clipper-footer">
				<div class="vault-path-container">
					<label for="path-name-field" class="sr-only">Folder path</label>
					<input id="path-name-field" type="text" data-i18n="folder"/>
				</div>
				<div id="interpreter" style="display: none;">
					<label for="prompt-context" class="sr-only">Prompt context</label>
					<textarea id="prompt-context" rows="3"></textarea>
					<div class="interpreter-controls">
						<label for="model-select" class="sr-only">Model</label>
						<select id="model-select" style="display: none;"></select>
						<button id="interpret-btn" data-i18n="interpret"></button>
						<span id="interpreter-timer" style="display: none;"></span>
					</div>
					<div id="token-counter" class="token-counter"></div>
					<div id="interpreter-error" style="display: none;" aria-live="assertive"></div>
				</div>
				<div class="action-buttons" id="action-buttons">
					<button id="clip-btn" class="mod-cta"><!-- Text set by determineMainAction --></button>
					<div class="menu-btn">
						<button id="more-btn" aria-expanded="false" aria-controls="more-dropdown" aria-label="More actions"><i data-lucide="chevron-down" aria-hidden="true"></i></button>
						<div class="menu" id="more-dropdown">
							<div class="secondary-actions">
								<!-- Secondary actions will be populated by ts -->
							</div>
						</div>
					</div>
					<div class="share-btn">
						<button type="button" class="share-content clickable-icon" data-i18n-title="share" aria-label="Share"><i data-lucide="share" aria-hidden="true"></i></button>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="popup.js"></script>
	</body>
</html>
