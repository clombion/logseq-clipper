name: Build and release

on:
  push:
    branches: [logseq]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test -- --reporter=verbose
        continue-on-error: true  # pre-existing upstream test failure

      - run: pnpm run build:chrome
      - run: pnpm run build:firefox

      # Zip Chrome build
      - name: Package Chrome zip
        run: cd dist && zip -r ../logseq-web-clipper-chrome.zip . && cd ..

      # Sign Firefox extension via Mozilla AMO (unlisted)
      - name: Sign Firefox extension
        id: sign
        run: |
          # Run signing, capture exit code instead of failing
          set +e
          pnpm web-ext sign \
            --source-dir=dist_firefox \
            --artifacts-dir=web-ext-artifacts \
            --channel=unlisted \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --timeout=900000
          SIGN_EXIT=$?
          set -e

          if [ $SIGN_EXIT -eq 0 ]; then
            XPI_FILE=$(find web-ext-artifacts -name "*.xpi" | head -1)
            if [ -n "$XPI_FILE" ]; then
              cp "$XPI_FILE" logseq-web-clipper-firefox.xpi
              echo "signed=true" >> $GITHUB_OUTPUT
              echo "Signing succeeded: $XPI_FILE"
            else
              echo "Signing reported success but no .xpi found"
              echo "signed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Signing failed (exit $SIGN_EXIT), falling back to unsigned zip"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      # Always create unsigned zip as fallback
      - name: Package Firefox zip
        run: cd dist_firefox && zip -r ../logseq-web-clipper-firefox.zip . && cd ..

      # Upload artifacts (available on every push)
      - uses: actions/upload-artifact@v4
        with:
          name: logseq-web-clipper-chrome.zip
          path: logseq-web-clipper-chrome.zip

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: logseq-web-clipper-firefox.xpi
          path: logseq-web-clipper-firefox.xpi

      - uses: actions/upload-artifact@v4
        with:
          name: logseq-web-clipper-firefox.zip
          path: logseq-web-clipper-firefox.zip

      # On release: attach to GitHub release + update GitHub Pages
      - name: Get version
        if: github.event_name == 'release'
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Generate updates.json
        if: github.event_name == 'release' && steps.sign.outputs.signed == 'true'
        run: |
          cat > updates.json << 'UPDATEEOF'
          {
            "addons": {
              "logseq-clipper@clombion.github.io": {
                "updates": [
                  {
                    "version": "${{ steps.version.outputs.version }}",
                    "update_link": "https://github.com/clombion/logseq-clipper/releases/download/${{ github.event.release.tag_name }}/logseq-web-clipper-firefox.xpi"
                  }
                ]
              }
            }
          }
          UPDATEEOF

      - name: Deploy updates.json to GitHub Pages
        if: github.event_name == 'release' && steps.sign.outputs.signed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true
          include_files: updates.json

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            logseq-web-clipper-chrome.zip
            logseq-web-clipper-firefox.xpi
            logseq-web-clipper-firefox.zip
          fail_on_unmatched_files: false
