name: Build and release

on:
  push:
    branches: [logseq]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test -- --reporter=verbose
        continue-on-error: true  # pre-existing upstream test failure

      - run: pnpm run build:chrome
      - run: pnpm run build:firefox

      # Zip build outputs
      - name: Package zips
        run: |
          cd dist && zip -r ../logseq-web-clipper-chrome.zip . && cd ..
          cd dist_firefox && zip -r ../logseq-web-clipper-firefox.zip . && cd ..

      # Upload zipped artifacts (available on every push)
      - uses: actions/upload-artifact@v4
        with:
          name: logseq-web-clipper-chrome.zip
          path: logseq-web-clipper-chrome.zip

      - uses: actions/upload-artifact@v4
        with:
          name: logseq-web-clipper-firefox.zip
          path: logseq-web-clipper-firefox.zip

      # On release: attach zips to the GitHub release
      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            logseq-web-clipper-chrome.zip
            logseq-web-clipper-firefox.zip
